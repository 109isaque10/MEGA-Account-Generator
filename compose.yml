services:
  mega-manager:
    image: ghcr.io/109isaque10/mega-account-generator:latest
    container_name: mega-account-manager
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Port to listen on
      - PORT=3000

      # Email pattern and domain for account generation
      - EMAIL_PATTERN=mega%d
      - EMAIL_DOMAIN=yourdomain.com

      # Periodic keep-alive interval in days
      - SIGNIN_INTERVAL_DAYS=30

      # Mailgun webhook credentials (optional: bypasses signature check if omitted)
      - MAILGUN_API_KEY=
      - MAILGUN_WEBHOOK_SIGNING_KEY=

      # Optional default password (if empty, random strong password generated)
      - MEGA_DEFAULT_PASSWORD=

      # Path to megatools binary inside scratch image
      - MEGATOOLS_PATH=/usr/local/bin/megatools

      # Persistence directory for accounts.csv and accounts.json
      - DATA_DIR=/data

    volumes:
      # Mount directory on host to persist accounts.csv and accounts.json
      - ./data:/data
